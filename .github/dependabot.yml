# Dependabot 配置
# 计划性版本更新（version updates）已禁用：不再开常规依赖升级 PR。
# 安全更新（security updates）在仓库 Settings → Code security 处开启，
# 与本文件无关——出现漏洞时 Dependabot 仍会照常提安全修复 PR。
# 需要常规升级时，临时把对应 ecosystem 的 open-pull-requests-limit 调回 >0 即可。
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/core
      - /packages/react
      - /demo
    schedule:
      interval: weekly
      day: monday
    # 0 = 关闭计划性版本更新 PR；安全 PR 不受此限制
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: 'chore'
      include: scope
    # 仍记录锁定/忽略规则，便于重新放开时复用
    ignore:
      # fabric 锁定 6.x；升 7 是主版本迁移，见 README 安全说明
      - dependency-name: fabric
        update-types:
          - version-update:semver-major
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # 0.x 跨小版本常不兼容；Dependabot 用 pnpm -r 更新时还会误装进其他 workspace
      - dependency-name: lucide-react
      - dependency-name: jsdom
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 0 = 关闭计划性版本更新 PR；安全 PR 不受此限制
    open-pull-requests-limit: 0
    labels:
      - dependencies
    commit-message:
      prefix: 'ci'
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
